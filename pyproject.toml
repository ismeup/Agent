[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ismeup-agent"
version = "1.0.0"
description = "isMeUp monitoring agent"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "pycryptodome>=3.18.0",
    "cryptography>=42.0.0",
]

[project.scripts]
ismeup-agent = "agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]