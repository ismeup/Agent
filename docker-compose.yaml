version: '3.8'

services:
  agent:
    build: .
    container_name: ismeup-agent
    restart: unless-stopped
    # Wake On Lan requires sending UDP broadcast packets to the local subnet,
    # which is impossible from a Docker bridge network, so the agent uses
    # host networking. Trade-offs: the container shares the host's network
    # namespace (no network isolation, no port mapping). Host networking is
    # not supported by Docker Desktop for macOS/Windows. If you don't use the
    # Wake On Lan check, this line can be removed — the agent only makes
    # outbound connections.
    network_mode: host
    volumes:
      - ./data:/app/data
    environment:
      - ISMEUP_HOST=${ISMEUP_HOST}
      - ISMEUP_PORT=${ISMEUP_PORT}
      - ISMEUP_URL=${ISMEUP_URL}

